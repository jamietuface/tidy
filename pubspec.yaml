name: tidy
description: Swipe to clean your camera roll. Stop paying for apps you don't use.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Firebase 3.x line (Firebase iOS SDK 11.x). Requires Xcode 15.2+ / iOS 13+.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_remote_config: ^5.1.3

  # Auth providers
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.1

  # Notifications (subscription renewal alerts)
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1

  # Photos
  photo_manager: ^3.6.0

  # On-device AI photo grouping (heuristic classifiers — no ML model)
  image: ^4.3.0
  crypto: ^3.0.5

  # Payments
  in_app_purchase: ^3.2.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
